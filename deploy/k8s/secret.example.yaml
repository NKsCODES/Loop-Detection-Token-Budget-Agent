# Example only. In a real cluster create this from a secret manager
# (External Secrets Operator, Sealed Secrets, or your cloud's CSI driver). Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: loopguard-secrets
  namespace: loopguard
type: Opaque
stringData:
  LOOPGUARD_DATABASE_URL: postgresql://loopguard:CHANGE_ME@postgres.example.internal:5432/loopguard
  LOOPGUARD_CHECKPOINT_URL: postgresql://loopguard:CHANGE_ME@postgres.example.internal:5432/loopguard
  LOOPGUARD_API_KEY: CHANGE_ME
  OPENAI_API_KEY: CHANGE_ME
  LANGSMITH_API_KEY: ""
