  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
# Create loopguard-secrets separately (see secret.example.yaml), then:
#   kubectl apply -k deploy/k8s
images:
  - name: ghcr.io/nkscodes/loopguard-agent
    newTag: latest
