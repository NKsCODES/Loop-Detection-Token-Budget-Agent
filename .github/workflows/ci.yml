name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv venv && uv pip install -e ".[dev,eval]"
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest --cov=loopguard --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  postgres-integration:
    name: postgres integration
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv venv && uv pip install -e ".[dev,postgres]"
      - run: uv run pytest tests/test_postgres.py -v
        env:
          LOOPGUARD_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/loopguard

  eval-gate:
    name: stuck-rate benchmark (gate)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv venv && uv pip install -e ".[eval]"
      # Fails the build if a change lets loops through: LoopGuard must stay at or below 5% stuck
      - run: uv run loopguard eval --out reports --max-stuck-rate 0.05
      - name: Benchmark summary
        run: cat reports/BENCHMARK.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: reports/

  docker:
    name: build image
    runs-on: ubuntu-latest
    needs: [quality, eval-gate]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/loopguard-agent:latest
            ghcr.io/${{ github.repository_owner }}/loopguard-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
