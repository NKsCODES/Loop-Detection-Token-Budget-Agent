[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "loopguard"
version = "1.0.0"
description = "Loop detection, step limits and token budgets for LangGraph tool-calling agents, with human-in-the-loop approval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Niraj Koli" }]
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.0",
  "langchain-core>=1.8,<2",
  "fastapi>=0.160",
  "uvicorn[standard]>=0.50",
  "pydantic>=2.10",
  "pydantic-settings>=2.10",
  "sqlalchemy>=2.0",
  "prometheus-client>=0.22",
  "structlog>=25.0",
  "typer>=0.15",
  "tiktoken>=0.9",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
postgres = ["langgraph-checkpoint-postgres>=3.0", "psycopg[binary,pool]>=3.2"]
eval = ["matplotlib>=3.9"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
loopguard = "loopguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/loopguard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
packages = ["loopguard"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
